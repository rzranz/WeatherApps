<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komparasi Kota — MeteoPulse PSD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="./css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body class="bg-slate-50 dark:bg-[#0B0F19] text-slate-900 dark:text-slate-100 min-h-screen font-sans p-4 sm:p-8">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- Top Bar -->
        <div class="flex items-center justify-between p-4 rounded-2xl glass-panel shadow-md border border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <a href="/" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-cyan-500 hover:text-white flex items-center justify-center text-slate-700 dark:text-slate-200 transition-colors">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-lg font-extrabold text-slate-900 dark:text-white">Komparasi Cuaca Antar Kota</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Analisis Perbandingan Multi-Kota (5 Hari)</p>
                </div>
            </div>

            <a href="/" class="px-4 py-2 rounded-xl text-xs font-bold bg-cyan-500 text-white shadow-md shadow-cyan-500/20 hover:bg-cyan-600 transition-all flex items-center gap-2">
                <i class="fas fa-satellite-dish"></i>
                <span>Kembali ke Dashboard</span>
            </a>
        </div>

        <!-- Controls -->
        <div class="rounded-2xl glass-panel p-6 shadow-xl border border-slate-200 dark:border-slate-800 space-y-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="city-input" placeholder="Ketik nama kota lalu tekan Tambah..."
                       class="flex-grow px-4 py-2.5 rounded-xl text-sm bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <button id="add-city-button" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white transition-colors">
                    <i class="fas fa-plus mr-1"></i> Tambah Kota
                </button>
                <button id="compare-button" class="px-6 py-2.5 rounded-xl text-sm font-bold bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white shadow-md shadow-cyan-500/25 transition-all">
                    <i class="fas fa-arrows-rotate mr-1"></i> Bandingkan
                </button>
            </div>

            <!-- City Tag Badges -->
            <div id="city-list" class="flex flex-wrap gap-2 pt-2"></div>

            <!-- Parameter Selection -->
            <div class="flex items-center gap-3 pt-2">
                <span class="text-xs font-semibold text-slate-400">Parameter:</span>
                <select id="param-select" class="bg-slate-100 dark:bg-slate-800 text-xs font-bold text-cyan-600 dark:text-cyan-400 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 focus:outline-none">
                    <option value="temperature_2m_max">Suhu Maksimum (°C)</option>
                    <option value="temperature_2m_min">Suhu Minimum (°C)</option>
                    <option value="temperature_avg">Suhu Rata-rata (°C)</option>
                    <option value="precipitation_sum">Curah Hujan (mm)</option>
                    <option value="wind_speed_avg">Kecepatan Angin (km/j)</option>
                </select>
            </div>

            <!-- Chart Container -->
            <div class="relative h-96 w-full pt-4">
                <canvas id="compare-chart"></canvas>
            </div>
        </div>

    </div>

    <script>
        const API_BASE = window.location.origin.includes('localhost:3000') || window.location.origin.includes('127.0.0.1:3000')
            ? ''
            : 'http://localhost:3000';

        let citiesToCompare = ['Bandung', 'Jakarta', 'Surabaya'];
        let compareChart = null;

        const cityListDiv = document.getElementById('city-list');
        const cityInput = document.getElementById('city-input');
        const paramSelect = document.getElementById('param-select');

        document.getElementById('add-city-button').addEventListener('click', addCity);
        document.getElementById('compare-button').addEventListener('click', fetchComparison);
        paramSelect.addEventListener('change', fetchComparison);
        cityInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addCity();
            }
        });

        function addCity() {
            const city = cityInput.value.trim();
            if (city && !citiesToCompare.includes(city)) {
                if (citiesToCompare.length >= 5) {
                    alert('Maksimal 5 kota.');
                    return;
                }
                citiesToCompare.push(city);
                renderCityTags();
                cityInput.value = '';
                fetchComparison();
            }
        }

        function renderCityTags() {
            cityListDiv.innerHTML = '';
            citiesToCompare.forEach((city, index) => {
                const tag = document.createElement('span');
                tag.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-cyan-100 dark:bg-cyan-900/50 text-cyan-800 dark:text-cyan-200 border border-cyan-300 dark:border-cyan-700/60';
                tag.innerHTML = `
                    <span>${city}</span>
                    <button class="hover:text-red-500 ml-1"><i class="fas fa-times"></i></button>
                `;
                tag.querySelector('button').addEventListener('click', () => {
                    citiesToCompare.splice(index, 1);
                    renderCityTags();
                    fetchComparison();
                });
                cityListDiv.appendChild(tag);
            });
        }

        async function fetchComparison() {
            if (citiesToCompare.length === 0) return;
            const param = paramSelect.value;

            try {
                const response = await fetch(`${API_BASE}/api/compare`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cities: citiesToCompare,
                        parameter: param
                    })
                });
                const data = await response.json();
                renderChart(data, param);
            } catch (error) {
                console.error('Error fetching comparison:', error);
            }
        }

        function renderChart(data, param) {
            const canvas = document.getElementById('compare-chart');
            const ctx = canvas.getContext('2d');
            const firstCity = Object.keys(data)[0];
            if (!firstCity) return;

            const labels = data[firstCity].time.map(d => {
                return new Date(d).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
            });

            const colors = ['#06b6d4', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
            const datasets = [];
            let cIndex = 0;

            for (const city in data) {
                const cColor = colors[cIndex % colors.length];
                datasets.push({
                    label: data[city].cityName || city,
                    data: data[city][param] || [],
                    borderColor: cColor,
                    backgroundColor: cColor + '22',
                    borderWidth: 3,
                    tension: 0.35,
                    pointRadius: 4
                });
                cIndex++;
            }

            if (compareChart) {
                compareChart.destroy();
            }

            compareChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            grid: { color: 'rgba(51, 65, 85, 0.35)' },
                            ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono' } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8', font: { family: 'JetBrains Mono' } }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#e2e8f0', font: { family: 'Plus Jakarta Sans', weight: '600' } }
                        }
                    }
                }
            });
        }

        renderCityTags();
        fetchComparison();
    </script>
</body>
</html>
